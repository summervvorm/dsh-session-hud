# Inserts this bundle's single Host row.
#
# Config keys — all optional, and an omitted key keeps its default:
#   expandAnimation  (bool, default true)  panel open/close transition
#   sessionAlert     (bool, default true)  emphasis when a Session joins the lists
#   completionAlert  (bool, default true)  emphasis when a Session finishes
#   alwaysOnTop      (bool, default true)  keep the HUD above the whole interface,
#                                          the window title bar included; off, it
#                                          drops to an ordinary overlay layer and
#                                          never parks on the title bar
- insert:
    - id: dsh-session-hud
      name: dsh-session-hud
      # config:
      #   alwaysOnTop: true
